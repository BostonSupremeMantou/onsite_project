<text x="48" y="438" class="label">Baseline numeric clinical - Accuracy</text>
<rect x="330" y="418" width="700" height="28" rx="4" fill="#f1f5f9"/>
<rect x="330" y="418" width="460.1" height="28" rx="4" fill="#2563eb"/>
