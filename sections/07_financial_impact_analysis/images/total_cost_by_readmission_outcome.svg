<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}
.label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#334155}
.small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#64748b}
.value{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#0f172a}
.kpi{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#0f172a}
</style>
<text x="48" y="52" class="title">Average Total Care Cost By Readmission Outcome</text>
<text x="48" y="82" class="subtitle">Uses nonnegative companion fields from the cleaned financial dataset.</text>
<line x1="90" y1="615" x2="1130" y2="615" stroke="#334155" stroke-width="1.5"/>
<rect x="310.0" y="200.1" width="80.0" height="414.9" rx="5" fill="#2563eb"/>
<text x="350.0" y="190.1" text-anchor="middle" class="value">$25.3K</text>
<text x="350.0" y="639" text-anchor="middle" class="small">Not readmitted</text>
<rect x="830.0" y="199.7" width="80.0" height="415.3" rx="5" fill="#2563eb"/>
<text x="870.0" y="189.7" text-anchor="middle" class="value">$25.3K</text>
<text x="870.0" y="639" text-anchor="middle" class="small">Readmitted</text>
<text x="48" y="692" class="small">Source: Cleaned NHN patient-level analysis dataset.</text>
</svg>
