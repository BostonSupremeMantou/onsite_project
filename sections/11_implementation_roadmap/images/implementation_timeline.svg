<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}
.label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#334155}
.small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#64748b}
.value{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#0f172a}
.kpi{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#0f172a}
</style>
<text x="48" y="52" class="title">12-Month Implementation Roadmap</text>
<text x="48" y="82" class="subtitle">Recommended sequence for turning analytics into operational action.</text>
<rect x="75" y="165" width="300" height="400" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="97" y="207" class="value">0-3 months</text>
<text x="97" y="247" class="small">Approve dashboard KPIs, risk</text>
<text x="97" y="265" class="small">model governance, and</text>
<text x="97" y="283" class="small">readmission reduction targets.</text>
<text x="97" y="311" class="small">Pilot pre-discharge risk</text>
<text x="97" y="329" class="small">scoring for emergency</text>
<text x="97" y="347" class="small">admissions and skilled nursing</text>
<text x="97" y="365" class="small">discharges.</text>
<text x="97" y="393" class="small">Fix follow-up status</text>
<text x="97" y="411" class="small">documentation workflow and</text>
<text x="97" y="429" class="small">missing-value monitoring.</text>
<rect x="450" y="165" width="300" height="400" rx="12" fill="#ccfbf1" stroke="#94a3b8"/>
<text x="472" y="207" class="value">3-6 months</text>
<text x="472" y="247" class="small">Expand targeted care</text>
<text x="472" y="265" class="small">coordination for high-risk</text>
<text x="472" y="283" class="small">chronic disease and prior-</text>
<text x="472" y="301" class="small">admission groups.</text>
<text x="472" y="329" class="small">Build Tableau dashboard</text>
<text x="472" y="347" class="small">dashboard using the prepared</text>
<text x="472" y="365" class="small">dashboard extract.</text>
<rect x="825" y="165" width="300" height="400" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="847" y="207" class="value">6-12 months</text>
<text x="847" y="247" class="small">Track ROI, readmission</text>
<text x="847" y="265" class="small">reduction, CMS penalty</text>
<text x="847" y="283" class="small">exposure, and intervention</text>
<text x="847" y="301" class="small">performance monthly.</text>
<text x="847" y="329" class="small">Refresh and validate the risk</text>
<text x="847" y="347" class="small">model with new outcomes and</text>
<text x="847" y="365" class="small">operational feedback.</text>
<text x="48" y="652" class="small">Source: Derived from NHN project findings and implementation constraints.</text>
</svg>
