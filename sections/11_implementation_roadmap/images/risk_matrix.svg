<text x="760.0" y="277.8" class="small">Staff capacity</text>
<circle cx="560.0" cy="347.0" r="16" fill="#dc2626" fill-opacity="0.88" stroke="#ffffff" stroke-width="3"/>
<text x="584.0" y="352.0" class="small">Model governance</text>
<circle cx="384.0" cy="400.0" r="16" fill="#16a34a" fill-opacity="0.88" stroke="#ffffff" stroke-width="3"/>
