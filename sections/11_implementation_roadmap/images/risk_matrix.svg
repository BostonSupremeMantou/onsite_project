<line x1="296.0" y1="135" x2="296.0" y2="665" stroke="#e2e8f0"/>
<line x1="120" y1="241.0" x2="1000" y2="241.0" stroke="#e2e8f0"/>
<line x1="472.0" y1="135" x2="472.0" y2="665" stroke="#e2e8f0"/>
<line x1="120" y1="347.0" x2="1000" y2="347.0" stroke="#e2e8f0"/>
<line x1="648.0" y1="135" x2="648.0" y2="665" stroke="#e2e8f0"/>
<line x1="120" y1="453.0" x2="1000" y2="453.0" stroke="#e2e8f0"/>
<line x1="824.0" y1="135" x2="824.0" y2="665" stroke="#e2e8f0"/>
<line x1="120" y1="559.0" x2="1000" y2="559.0" stroke="#e2e8f0"/>
<text x="560.0" y="720" text-anchor="middle" class="label">Implementation effort</text>
<text x="55" y="400.0" text-anchor="middle" class="label" transform="rotate(-90 55,400.0)">Expected impact</text>
