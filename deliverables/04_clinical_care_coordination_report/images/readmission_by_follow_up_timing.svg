<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}
.label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#334155}
.small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#64748b}
.value{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#0f172a}
.kpi{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#0f172a}
</style>
<text x="48" y="52" class="title">Readmission Rate By Follow-Up Timing</text>
<text x="48" y="82" class="subtitle">Timing uses the imputed analysis field and should be reviewed with missing-value flags.</text>
<line x1="90" y1="615" x2="1130" y2="615" stroke="#334155" stroke-width="1.5"/>
<rect x="180.0" y="197.3" width="80.0" height="417.7" rx="5" fill="#d97706"/>
<text x="220.0" y="187.3" text-anchor="middle" class="value">42.6%</text>
<text x="220.0" y="639" text-anchor="middle" class="small">1-7 days</text>
<rect x="440.0" y="188.0" width="80.0" height="427.0" rx="5" fill="#d97706"/>
<text x="480.0" y="178.0" text-anchor="middle" class="value">43.6%</text>
<text x="480.0" y="639" text-anchor="middle" class="small">15-21 days</text>
<rect x="700.0" y="188.3" width="80.0" height="426.7" rx="5" fill="#d97706"/>
<text x="740.0" y="178.3" text-anchor="middle" class="value">43.5%</text>
<text x="740.0" y="639" text-anchor="middle" class="small">22-30 days</text>
<rect x="960.0" y="193.9" width="80.0" height="421.1" rx="5" fill="#d97706"/>
<text x="1000.0" y="183.9" text-anchor="middle" class="value">43.0%</text>
<text x="1000.0" y="639" text-anchor="middle" class="small">8-14 days</text>
<text x="48" y="692" class="small">Source: Cleaned NHN patient-level analysis dataset.</text>
</svg>
