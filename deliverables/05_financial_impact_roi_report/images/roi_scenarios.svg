<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}
.label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#334155}
.small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#64748b}
.value{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#0f172a}
.kpi{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#0f172a}
</style>
<text x="48" y="52" class="title">Estimated ROI By Scenario</text>
<text x="48" y="82" class="subtitle">ROI equals net savings divided by implementation cost assumption.</text>
<line x1="90" y1="615" x2="1130" y2="615" stroke="#334155" stroke-width="1.5"/>
<rect x="223.3" y="288.0" width="80.0" height="327.0" rx="5" fill="#0f766e"/>
<text x="263.3" y="278.0" text-anchor="middle" class="value">4.28</text>
<text x="263.3" y="639" text-anchor="middle" class="small">Conservative</text>
<rect x="570.0" y="230.3" width="80.0" height="384.7" rx="5" fill="#0f766e"/>
<text x="610.0" y="220.3" text-anchor="middle" class="value">5.03</text>
<text x="610.0" y="639" text-anchor="middle" class="small">Expected</text>
<rect x="916.7" y="206.7" width="80.0" height="408.3" rx="5" fill="#0f766e"/>
<text x="956.7" y="196.7" text-anchor="middle" class="value">5.34</text>
<text x="956.7" y="639" text-anchor="middle" class="small">Optimistic</text>
<text x="48" y="692" class="small">Source: Cleaned NHN patient-level analysis dataset.</text>
</svg>
