<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}
.label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#334155}
.small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#64748b}
.value{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#0f172a}
.kpi{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#0f172a}
</style>
<text x="48" y="52" class="title">Executive Dashboard Wireframe</text>
<text x="48" y="82" class="subtitle">Recommended Tableau or Power BI page layout.</text>
<rect x="50" y="120" width="250" height="110" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/>
<text x="72" y="160" class="value">KPI Summary</text>
<text x="72" y="195" class="small">Readmission rate, high-risk count, total</text>
<text x="72" y="216" class="small">cost, penalties, ROI</text>
<rect x="325" y="120" width="420" height="260" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="347" y="160" class="value">Clinical Analytics</text>
<text x="347" y="195" class="small">Risk profiles, diagnosis, chronic burden,</text>
<text x="347" y="216" class="small">readmission patterns</text>
<rect x="770" y="120" width="480" height="260" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="792" y="160" class="value">Financial Analytics</text>
<text x="792" y="195" class="small">Cost exposure, penalties, reimbursement</text>
<text x="792" y="216" class="small">gap, ROI scenarios</text>
<rect x="50" y="260" width="250" height="280" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="72" y="300" class="value">Filters</text>
<text x="72" y="335" class="small">Diagnosis, age group, admission type,</text>
<text x="72" y="356" class="small">discharge disposition, risk decile</text>
<rect x="325" y="410" width="420" height="270" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="347" y="450" class="value">Care Coordination</text>
<text x="347" y="485" class="small">Follow-up, medication review, home health,</text>
<text x="347" y="506" class="small">transportation, calls</text>
<rect x="770" y="410" width="480" height="270" rx="10" fill="#ccfbf1" stroke="#94a3b8" stroke-width="1.5"/>
<text x="792" y="450" class="value">Recommendation Center</text>
<text x="792" y="485" class="small">Top priorities, expected impact,</text>
<text x="792" y="506" class="small">implementation phase</text>
<text x="48" y="752" class="small">Build using dashboard_ready_extract.csv, dashboard_kpis.csv, and roi_scenarios.csv.</text>
